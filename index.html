<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anoka Parcel Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div>
      <h1>Anoka Parcel Map</h1>
      <p id="status">Starting map…</p>
    </div>
    <button id="locateButton" type="button">Locate me</button>
  </header>

  <main>
    <div id="map" aria-label="Map showing parcel boundaries"></div>
    <p class="disclaimer">
      Parcel lines and property information are for reference only—not for
      surveying, legal boundary decisions, or determining permission to enter.
    </p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
